  --reader-bg:#3a3631;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);background-attachment:fixed;background-repeat:no-repeat;background-size:cover;min-height:100vh;color:var(--ink);font-family:'Roboto',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

header{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:20px 16px 14px}
h1{margin:0;text-align:center;font-family:'Lora',serif;font-size:26px;font-weight:700;letter-spacing:.2px}
.add-btn{width:44px;height:44px;display:grid;place-items:center;background:var(--btn);color:var(--btn-ink);border:0;border-radius:50%;padding:0}
.add-btn svg{width:22px;height:22px}

.shelves{display:flex;flex-direction:column;gap:6px;padding:0 0 40px}
.shelf{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 10px;scroll-padding-left:16px;scroll-padding-right:16px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.shelf::after{content:'';flex:none;width:4px}
.shelf .book{flex:none;width:42vw;min-width:148px;max-width:210px;scroll-snap-align:start}
.hbtns{display:flex;gap:8px;align-items:center}
.theme-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--track);background:transparent;display:grid;place-items:center;color:var(--ink)}
.theme-btn svg{width:20px;height:20px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sw{border:2px solid transparent;border-radius:16px;padding:10px 8px 8px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-size:13px;text-align:left}
.sw .dots{display:flex;gap:4px}
.sw .dots i{width:14px;height:14px;border-radius:50%;display:block}
.sw.sel{border-color:var(--ink)}
.book{-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);position:relative;background:var(--card);border:2px solid var(--card-line);border-radius:22px;padding:16px 16px 14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.cover-wrap{container-type:inline-size;position:relative;aspect-ratio:2/3;border-radius:8px;overflow:hidden;box-shadow:0 4px 10px rgba(60,45,25,.22);background:#ddd;border:0;padding:0;width:100%}
.cover-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.gen{width:100%;height:100%;padding:9cqw 8cqw;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;font-family:'Lora',serif}
.gen b{font-size:15px;font-size:12.5cqw;line-height:1.12;font-weight:700;overflow-wrap:break-word;hyphens:manual}
.gen i{font-style:normal;font-family:'Roboto',sans-serif;font-size:11px;font-weight:500;opacity:.9}
.badge{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:500;padding:3px 8px;border-radius:999px;backdrop-filter:blur(4px)}
.badge.no{background:rgba(255,255,255,.9);color:#4a4338}
.title{font-size:16px;line-height:1.25;margin:2px 0 0;font-weight:400;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.author{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.prog .track{flex:1;height:5px;background:var(--track);border-radius:9px;overflow:hidden}
.prog .fill{height:100%;background:var(--bar);border-radius:9px}
.pgs{font-size:12px;color:var(--muted);margin-top:-2px}
.more{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;color:var(--muted)}
.more svg{width:20px;height:20px}

.empty{text-align:center;color:var(--muted);padding:60px 24px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:34}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));z-index:35;transform:translateY(105%);transition:transform .22s ease;max-height:92%;overflow:auto}
.sheet.on{transform:none}
@media (min-width:700px){.sheet{left:50%;right:auto;width:480px;margin-left:-240px}}
.sheet h2{margin:0 0 14px;font-size:19px;font-weight:500}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
input[type=text]{width:100%;font:inherit;font-size:16px;background:var(--field);color:var(--ink);border:1.5px solid var(--track);border-radius:12px;padding:12px 14px}
.file-btn{display:flex;align-items:center;gap:10px;width:100%;background:var(--field);border:1.5px dashed var(--muted);border-radius:12px;padding:14px;font-size:15px;text-align:left}
.file-btn svg{width:22px;height:22px;flex:none}
.file-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;border:0;border-radius:999px;padding:13px 16px;font-size:16px;font-weight:500;background:var(--btn);color:var(--btn-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--track)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn[disabled]{opacity:.55}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .btn{text-align:left;padding:14px 18px;background:var(--field);color:var(--ink);font-weight:400}
.menu .btn.danger{background:var(--field);color:var(--danger)}
.note{font-size:13px;color:var(--muted);margin:0 0 4px}

/* Reader */
.reader{position:fixed;inset:0;background:var(--reader-bg);z-index:30;display:none;flex-direction:column;color:#f1ece3}
.reader.on{display:flex}
.rbar{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;background:rgba(0,0,0,.35)}
.rbar .rt{flex:1;min-width:0;text-align:center;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:#f1ece3;flex:none}
.ib svg{width:24px;height:24px}
.ib:disabled{opacity:.35}
.ib.act{background:rgba(255,255,255,.18)}
.stage{flex:1;overflow:auto;display:flex;padding:8px;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
.pbox{position:relative;margin:auto;flex:none}
.stage canvas{display:block;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.textLayer{position:absolute;left:0;top:0;overflow:hidden;line-height:1;z-index:2;-webkit-user-select:text;user-select:text;text-size-adjust:none}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer ::selection{background:rgba(70,120,255,.35)}
.qnote{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:5;display:none;background:#f1ece3;color:#1c1a17;border:0;border-radius:999px;padding:12px 20px;font-size:15px;font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.45);-webkit-user-select:none;user-select:none;white-space:nowrap}
.qnote.on{display:block}
textarea{width:100%;font:inherit;font-size:16px;background:var(--field);color:var(--ink);border:1.5px solid var(--track);border-radius:12px;padding:12px 14px;resize:vertical}
.notes{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.nt{background:var(--field);border-radius:14px;padding:12px 14px}
.nt p{margin:0 0 8px;white-space:pre-wrap;font-family:'Lora',serif;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.nm{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.nm button{border:0;background:transparent;color:var(--danger);font-size:13px;padding:6px 0 6px 12px}
.none-n{color:var(--muted);font-size:14px;text-align:center;margin:6px 0}
.stage.night canvas{filter:invert(1) hue-rotate(180deg)}
.rbot{display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.35)}
.pg{display:flex;align-items:center;gap:6px;font-size:15px;margin:0 6px}
.pg input{width:56px;text-align:center;font:inherit;font-size:16px;background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:10px;padding:8px 4px}
.spin{position:absolute;top:50%;left:50%;width:34px;height:34px;margin:-17px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:none}
.spin.on{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}.sheet{transition:none}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2b2622;color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;z-index:40;display:none;max-width:90%;text-align:center}
.toast.on{display:block}
</style>
</head>
<body>

<header>
  <button class="theme-btn" id="themeBtn" aria-label="Escolher tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.5-.2-.8-.4-1.2-.3-.4-.4-.7-.4-1.1 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4-4-6.5-9-6.5z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7" r="1"/></svg></button>
  <h1>Biblioteca</h1>
  <button class="add-btn" id="addBtn" aria-label="Adicionar livro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</header>
<main class="shelves" id="grid" aria-live="polite"></main>

<!-- Sheet -->
<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>

<!-- Reader -->
<section class="reader" id="reader" aria-label="Leitor de PDF">
  <div class="rbar">
    <button class="ib" id="rClose" aria-label="Fechar leitor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="rt" id="rTitle"></div>
    <button class="ib" id="rNotes" aria-label="Anotações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></button>
    <button class="ib" id="rNight" aria-label="Modo noturno"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
  </div>
  <div class="stage" id="stage"><div class="pbox" id="pbox"><canvas id="cv"></canvas><div class="textLayer" id="tl"></div></div></div>
  <button class="qnote" id="qNote" type="button">Salvar seleção em Anotações</button>
  <div class="spin" id="spin"></div>
  <div class="rbot">
    <button class="ib" id="zOut" aria-label="Diminuir zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-4-4"/></svg></button>
    <button class="ib" id="prev" aria-label="Página anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="pg"><input id="pgIn" type="text" inputmode="numeric" aria-label="Número da página"><span id="pgTot">/ 0</span></div>
    <button class="ib" id="next" aria-label="Próxima página"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="ib" id="zIn" aria-label="Aumentar zoom"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M20 20l-4-4"/></svg></button>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- pdf.js ---------- */
const pdfjs = window.pdfjsLib;
if (pdfjs) pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ---------- Leitura de arquivo / abertura de PDF ---------- */
async function readBuf(file){
  try{ return await file.arrayBuffer(); }
  catch(e){
    return await new Promise((res,rej)=>{
      const r = new FileReader();
      r.onload = ()=>res(r.result);
      r.onerror = ()=>rej(new Error('read'));
      r.readAsArrayBuffer(file);
    });
  }
}
function openDoc(buf){
  return pdfjs.getDocument({data:new Uint8Array(buf.slice(0)), isEvalSupported:false}).promise;
}
function pdfErr(err){
  const n = (err && err.name) || '', m = (err && err.message) || '';
  console.error('PDF error:', err);
  if(m==='lib') return 'O leitor de PDF não carregou. Verifique a internet e abra de novo.';
  if(m==='read') return 'Não consegui ler o arquivo. Baixe o PDF no celular e escolha de novo.';
  if(m==='nofile') return 'O PDF deste livro não foi encontrado. Anexe o arquivo de novo.';
  if(n==='PasswordException') return 'Este PDF tem senha e não pode ser aberto.';
  if(n==='InvalidPDFException') return 'Esse arquivo não é um PDF válido ou está corrompido.';
  return 'Não foi possível abrir o PDF ('+(n||'erro')+(m?': '+m.slice(0,70):'')+')';
}

/* ---------- Storage (IndexedDB, com fallback em memória) ---------- */
const mem = {books:new Map(), files:new Map()};
let idb = null;
function openDB(){
  return new Promise(res=>{
    try{
      const r = indexedDB.open('biblioteca-pdf',1);
      r.onupgradeneeded = ()=>{ const d=r.result; d.createObjectStore('books',{keyPath:'id'}); d.createObjectStore('files'); };
      r.onsuccess = ()=>res(r.result);
      r.onerror = ()=>res(null);
      r.onblocked = ()=>res(null);
    }catch(e){ res(null); }
  });
}
function tx(store, mode, fn){
  return new Promise((res,rej)=>{
    try{
      const t = idb.transaction(store, mode);
      const out = fn(t.objectStore(store));
      t.oncomplete = ()=>res(out && out.result!==undefined ? out.result : undefined);
      t.onerror = ()=>rej(t.error);
      t.onabort = ()=>rej(t.error);
    }catch(e){ rej(e); }
  });
}
const store = {
  async allBooks(){ if(!idb) return [...mem.books.values()]; return tx('books','readonly',s=>s.getAll()); },
  async putBook(b){ if(!idb){mem.books.set(b.id,b);return;} return tx('books','readwrite',s=>s.put(b)); },
  async delBook(id){ if(!idb){mem.books.delete(id);mem.files.delete(id);return;}
    const t = idb.transaction(['books','files'],'readwrite');
    t.objectStore('books').delete(id); t.objectStore('files').delete(id);
    return new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error);}); },
  async putFile(id,blob){ if(!idb){mem.files.set(id,blob);return;} return tx('files','readwrite',s=>s.put(blob,id)); },
  async getFile(id){ if(!idb) return mem.files.get(id)||null; return tx('files','readonly',s=>s.get(id)); }
};

/* ---------- Dados ---------- */
let books = [];
const SEED = [
  {title:'Atomic Habits',author:'James Clear',bg:'#f5efe3',fg:'#d1a272'},
  {title:'Educated',author:'Tara Westover',bg:'#f3ead6',fg:'#6f6a5e'},
  {title:'The Midnight Library',author:'Matt Haig',bg:'#14246b',fg:'#f0d98a'},
  {title:'Klara and the Sun',author:'Kazuo Ishiguro',bg:'#f2c13d',fg:'#c8321e'},
  {title:'Project Hail Mary',author:'Andy Weir',bg:'#0d0d0d',fg:'#ffffff'},
  {title:'Where the Crawdads Sing',author:'Delia Owens',bg:'#ef9a7c',fg:'#ffffff'},
  {title:'1984',author:'George Orwell',bg:'#b3261e',fg:'#f6e9d2'},
  {title:'O Alquimista',author:'Paulo Coelho',bg:'#e9b949',fg:'#7a2418'},
  {title:'Sapiens',author:'Yuval Noah Harari',bg:'#d9e3ea',fg:'#1f3a52'},
  {title:'Dom Casmurro',author:'Machado de Assis',bg:'#2f4f3e',fg:'#f2e8c9'},
  {title:'O Hobbit',author:'J.R.R. Tolkien',bg:'#6b8f5a',fg:'#fdf3d4'},
  {title:'Deep Work',author:'Cal Newport',bg:'#1f2a44',fg:'#ffd166'},
  {title:'Orgulho e Preconceito',author:'Jane Austen',bg:'#f4d6d6',fg:'#7a2e4a'},
  {title:'O Pequeno Príncipe',author:'Antoine de Saint-Exupéry',bg:'#9ec9e2',fg:'#2b3a67'}
];
const PALETTE = [['#f5efe3','#b8864f'],['#14246b','#f0d98a'],['#2f4f3e','#f2e8c9'],['#7a2e2e','#fbe9d0'],['#0d0d0d','#ffffff'],['#e9b949','#7a2418'],['#d9e3ea','#1f3a52']];
const uid = ()=> (crypto.randomUUID ? crypto.randomUUID() : 'b'+Date.now()+Math.random().toString(16).slice(2));

async function load(){
  idb = await openDB();
  try{
    let list = await store.allBooks();
    let done = false;
    try{ done = localStorage.getItem('bib-seed-v2')==='1'; }catch(e){}
    if(!done){
      const have = new Set(list.map(b=>b.title));
      let i = 0;
      for(const s of SEED){
        if(have.has(s.title)) continue;
        const b={id:uid(),hasPdf:false,pages:0,page:0,progress:0,cover:null,added:Date.now()+(i++),...s};
        await store.putBook(b); list.push(b);
      }
      // zera porcentagens de exemplo: só vale o progresso real de leitura
      for(const b of list){
        if(!b.hasPdf && (b.progress||b.page)){ b.progress=0; b.page=0; await store.putBook(b); }
      }
      try{ localStorage.setItem('bib-seed-v2','1'); }catch(e){}
    }
    let cv3 = false;
    try{ cv3 = localStorage.getItem('bib-cover-v3')==='1'; }catch(e){}
    if(!cv3){
      for(const b of list){ if(b.cover && !b.coverCustom){ b.cover=null; await store.putBook(b); } }
      try{ localStorage.setItem('bib-cover-v3','1'); }catch(e){}
    }
    books = list.sort((a,b)=>a.added-b.added);
  }catch(e){ books=[]; }
  render();
}

/* ---------- Grade ---------- */
function coverHTML(b){
  if(b.cover) return `<img src="${b.cover}" alt="Capa de ${esc(b.title)}">`;
  return `<div class="gen" style="background:${b.bg||'#f5efe3'};color:${b.fg||'#b8864f'}"><b>${esc(b.title)}</b></div>`;
}
function pct(b){ return (b.hasPdf && b.pages) ? Math.min(100,Math.round(Math.max(1,b.page||1)/b.pages*100)) : 0; }
function card(b){
  return `
    <article class="book" data-id="${b.id}">
      <button class="cover-wrap" data-open="${b.id}" aria-label="${b.hasPdf?'Ler':'Anexar PDF a'} ${esc(b.title)}">${coverHTML(b)}</button>
      <button class="more" data-more="${b.id}" aria-label="Opções de ${esc(b.title)}">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
      <div class="title">${esc(b.title)}</div>
      <div class="prog"><span>${pct(b)}%</span><div class="track"><div class="fill" style="width:${pct(b)}%"></div></div></div>
      ${b.hasPdf&&b.pages?`<div class="pgs">Página ${Math.max(1,b.page||1)} de ${b.pages}</div>`:''}
    </article>`;
}
function render(){
  const g = $('grid');
  if(!books.length){
    g.innerHTML = '<div class="empty">Nenhum livro ainda.<br>Toque em <b>Adicionar</b> e escolha um PDF.</div>';
    return;
  }
  // prateleiras horizontais: a cada 7 livros começa uma nova prateleira abaixo
  const rows = [];
  for(let i=0;i<books.length;i+=7) rows.push(books.slice(i,i+7));
  const keep = [...g.querySelectorAll('.shelf')].map(el=>el.scrollLeft);
  g.innerHTML = rows.map((r,i)=>`<div class="shelf" aria-label="Prateleira ${i+1}">${r.map(card).join('')}</div>`).join('');
  [...g.querySelectorAll('.shelf')].forEach((el,i)=>{ el.scrollLeft = keep[i]||0; });
}
$('grid').addEventListener('click',e=>{
  const o = e.target.closest('[data-open]'); const m = e.target.closest('[data-more]');
  if(m){ openMenu(m.dataset.more); return; }
  if(o){ const b=books.find(x=>x.id===o.dataset.open); if(!b) return; b.hasPdf ? openReader(b) : openForm(b,true); }
});

/* ---------- Sheet ---------- */
const sheet = $('sheet'), scrim = $('scrim');
function showSheet(html){ sheet.innerHTML = html; scrim.classList.add('on'); requestAnimationFrame(()=>sheet.classList.add('on')); }
function hideSheet(){ sheet.classList.remove('on'); scrim.classList.remove('on'); }
scrim.addEventListener('click',hideSheet);

function openMenu(id){
  const b = books.find(x=>x.id===id); if(!b) return;
  showSheet(`
    <h2>${esc(b.title)}</h2>
    <div class="menu">
      ${b.hasPdf?'<button class="btn" id="mRead">Ler agora</button>':''}
      <button class="btn" id="mNotes">Anotações${(b.notes&&b.notes.length)?' ('+b.notes.length+')':''}</button>
      <button class="btn" id="mEdit">${b.hasPdf?'Editar ou trocar PDF':'Anexar PDF'}</button>
      <button class="btn danger" id="mDel">Remover livro</button>
    </div>
    <div class="row"><button class="btn ghost" id="mCancel">Fechar</button></div>`);
  $('mCancel').onclick = hideSheet;
  if(b.hasPdf) $('mRead').onclick = ()=>{ hideSheet(); openReader(b); };
  $('mNotes').onclick = ()=>openNotes(b,false);
  $('mEdit').onclick = ()=>openForm(b,false);
  let armed=false;
  $('mDel').onclick = async function(){
    if(!armed){ armed=true; this.textContent='Toque de novo para confirmar'; return; }
    await store.delBook(b.id); books = books.filter(x=>x.id!==b.id); render(); hideSheet(); toast('Livro removido');
  };
}

function openForm(b, fromTap){
  const isNew = !b;
  let file = null, coverData = null;
  showSheet(`
    <h2>${isNew?'Novo livro':'Editar livro'}</h2>
    ${fromTap?'<p class="note">Este livro ainda não tem PDF. Escolha o arquivo para poder ler aqui no app.</p>':''}
    <label for="fTitle">Título</label>
    <input type="text" id="fTitle" value="${esc(b?b.title:'')}" autocomplete="off">
    <label>Arquivo PDF (opcional)</label>
    <button class="file-btn" id="fPick" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 17v-6M9.5 13.5L12 11l2.5 2.5"/></svg>
      <span id="fName">${b&&b.hasPdf?'PDF já anexado — toque para trocar':'Escolher PDF'}</span>
    </button>
    <input type="file" id="fFile" accept="application/pdf,.pdf" hidden>
    <label>Capa (opcional)</label>
    <button class="file-btn" id="cPick" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 9"/></svg>
      <span id="cName">${b&&b.coverCustom?'Capa da galeria — toque para trocar':'Escolher da galeria'}</span>
    </button>
    <input type="file" id="cFile" accept="image/*" hidden>
    <div class="row">
      <button class="btn ghost" id="fCancel" type="button">Cancelar</button>
      <button class="btn" id="fSave" type="button">Salvar</button>
    </div>`);
  $('fCancel').onclick = hideSheet;
  $('fPick').onclick = ()=>$('fFile').click();
  $('cPick').onclick = ()=>$('cFile').click();
  $('cFile').onchange = async e=>{
    const img = e.target.files[0]; if(!img) return;
    try{ coverData = await imageToCover(img); $('cName').textContent = img.name; }
    catch(err){ coverData = null; toast('Não foi possível usar essa imagem'); }
  };
  $('fFile').onchange = e=>{
    file = e.target.files[0] || null;
    if(file){
      $('fName').textContent = file.name;
      if(!$('fTitle').value.trim()) $('fTitle').value = file.name.replace(/\.pdf$/i,'').replace(/[_-]+/g,' ').trim();
    }
  };
  $('fSave').onclick = async function(){
    const title = $('fTitle').value.trim();
    if(!title){ toast('Digite o título do livro'); return; }
    this.disabled = true; this.textContent = 'Salvando…';
    try{
      let rec = b ? b : (()=>{ const p=PALETTE[Math.floor(Math.random()*PALETTE.length)]; return {id:uid(),bg:p[0],fg:p[1],progress:0,page:0,pages:0,cover:null,hasPdf:false,added:Date.now()}; })();
      rec.title = title;
      if(file){
        if(!pdfjs) throw new Error('lib');
        const buf = await readBuf(file);
        const doc = await openDoc(buf);
        rec.pages = doc.numPages;
        
        await store.putFile(rec.id, buf);
        rec.hasPdf = true;
        if(rec.page > rec.pages) rec.page = 0;
        if(!rec.page && rec.progress) rec.page = Math.max(1, Math.round(rec.progress/100*rec.pages));
        doc.destroy();
      }
      if(coverData){ rec.cover = coverData; rec.coverCustom = true; }
      await store.putBook(rec);
      if(isNew) books.push(rec);
      render(); hideSheet(); toast(file?'PDF anexado ao livro':'Livro salvo');
    }catch(err){
      this.disabled=false; this.textContent='Salvar';
      toast(pdfErr(err), 6000);
    }
  };
}
$('addBtn').onclick = ()=>openForm(null,false);

/* ---------- Anotações ---------- */
function addNote(b, text, page){
  b.notes = b.notes || [];
  b.notes.unshift({id:uid(), text, page:page||null, t:Date.now()});
  return store.putBook(b);
}
function openNotes(b){
  const inReader = $('reader').classList.contains('on') && R.book && R.book.id===b.id;
  const notes = b.notes || [];
  showSheet(`
    <h2>Anotações</h2>
    <p class="note">${esc(b.title)}</p>
    <label for="nTxt">Cole aqui a frase copiada do livro</label>
    <textarea id="nTxt" rows="4" placeholder="Pressione e segure para colar"></textarea>
    <div class="row">
      <button class="btn ghost" id="nPaste" type="button">Colar</button>
      <button class="btn" id="nSave" type="button">Salvar anotação</button>
    </div>
    <div class="notes">${notes.length ? notes.map(n=>`
      <div class="nt"><p>${esc(n.text)}</p>
        <div class="nm"><span>${n.page?'Página '+n.page:''}</span><button data-del="${n.id}" type="button">Excluir</button></div>
      </div>`).join('') : '<p class="none-n">Nenhuma anotação neste livro ainda.</p>'}</div>
    <div class="row"><button class="btn ghost" id="nClose" type="button">Fechar</button></div>`);
  $('nClose').onclick = ()=>{ hideSheet(); render(); };
  $('nPaste').onclick = async ()=>{
    try{ const t = await navigator.clipboard.readText(); if(t) $('nTxt').value += (($('nTxt').value?'\n':'')+t); else toast('Nada copiado ainda'); }
    catch(e){ toast('Pressione e segure no campo para colar'); $('nTxt').focus(); }
  };
  $('nSave').onclick = async ()=>{
    const t = $('nTxt').value.trim();
    if(!t){ toast('Cole ou digite a anotação'); return; }
    await addNote(b, t, inReader ? R.n : null);
    toast('Anotação salva'); openNotes(b);
  };
  sheet.querySelectorAll('[data-del]').forEach(btn=>{
    let armed=false;
    btn.onclick = async ()=>{
      if(!armed){ armed=true; btn.textContent='Confirmar exclusão'; return; }
      b.notes = (b.notes||[]).filter(n=>n.id!==btn.dataset.del);
      await store.putBook(b); openNotes(b);
    };
  });
}

/* ---------- Temas ---------- */

let curTheme = 'auto';
function applyTheme(id){
  curTheme = id;
  if(id==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',id);
  try{ localStorage.setItem('bib-theme',id); }catch(e){}
}
try{ const t = localStorage.getItem('bib-theme'); if(t && THEMES.some(x=>x.id===t)) applyTheme(t); }catch(e){}
function openThemes(){
  showSheet(`<h2>Tema do app</h2>
    <div class="themes">${THEMES.map(t=>`
      <button class="sw ${t.id===curTheme?'sel':''}" data-t="${t.id}" style="background:${t.bg};color:${t.ink}" aria-label="Tema ${t.name}">
        <span class="dots"><i style="background:${t.ink}"></i><i style="background:${t.bar}"></i></span>${t.name}
      </button>`).join('')}</div>
    <div class="row"><button class="btn ghost" id="thClose">Fechar</button></div>`);
  $('thClose').onclick = hideSheet;
  sheet.querySelectorAll('[data-t]').forEach(el=>el.onclick=()=>{ applyTheme(el.dataset.t); openThemes(); });
}
$('themeBtn').onclick = openThemes;

function imageToCover(file){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = ()=>{
      const w = Math.min(480, im.naturalWidth), h = Math.round(im.naturalHeight * w / im.naturalWidth);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',0.85));
    };
    im.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('img')); };
    im.src = url;
  });
}

async function makeCover(doc){
  const page = await doc.getPage(1);
  const v1 = page.getViewport({scale:1});
  const vp = page.getViewport({scale: 360 / v1.width});
  const c = document.createElement('canvas');
  c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:ctx, viewport:vp}).promise;
  return c.toDataURL('image/jpeg',0.8);
}

/* ---------- Leitor ---------- */
const R = {doc:null, book:null, n:1, zoom:1, task:null, tl:null, token:0};
const cv = $('cv'), stage = $('stage');

async function openReader(b){
  if(!pdfjs){ toast('Leitor de PDF não carregou. Verifique a conexão.'); return; }
  $('reader').classList.add('on'); $('spin').classList.add('on');
  $('rTitle').textContent = b.title;
  $('tl').innerHTML='';
  R.book = b; R.zoom = 1;
  try{
    const data = await store.getFile(b.id);
    if(!data) throw new Error('nofile');
    const buf = (typeof Blob!=='undefined' && data instanceof Blob) ? await data.arrayBuffer() : data;
    R.doc = await openDoc(buf);
    b.pages = R.doc.numPages;
    R.n = Math.min(Math.max(1, b.page||1), b.pages);
    $('pgTot').textContent = '/ ' + b.pages;
    await show(R.n);
  }catch(e){
    closeReader(); toast(pdfErr(e), 6000);
  }
}
function closeReader(){
  $('reader').classList.remove('on'); $('spin').classList.remove('on');
  if(R.task){ try{R.task.cancel();}catch(e){} }
  if(R.tl){ try{R.tl.cancel();}catch(e){} }
  if(R.doc){ try{R.doc.destroy();}catch(e){} R.doc=null; }
  $('qNote').classList.remove('on'); hideSheet();
  render();
}
async function show(n){
  if(!R.doc) return;
  n = Math.min(Math.max(1,n), R.doc.numPages);
  R.n = n; const my = ++R.token;
  $('pgIn').value = n;
  $('prev').disabled = n<=1; $('next').disabled = n>=R.doc.numPages;
  $('spin').classList.add('on');
  if(R.task){ try{R.task.cancel();}catch(e){} }
  const page = await R.doc.getPage(n);
  if(my !== R.token) return;
  const base = page.getViewport({scale:1});
  const fit = (stage.clientWidth - 16) / base.width;
  const vp = page.getViewport({scale: fit * R.zoom});
  const dpr = Math.min(window.devicePixelRatio||1, 3);
  cv.width = Math.floor(vp.width*dpr); cv.height = Math.floor(vp.height*dpr);
  cv.style.width = Math.floor(vp.width)+'px'; cv.style.height = Math.floor(vp.height)+'px';
  const ctx = cv.getContext('2d');
  R.task = page.render({canvasContext:ctx, viewport:vp, transform:[dpr,0,0,dpr,0,0]});
  try{ await R.task.promise; }catch(e){ return; }
  if(my !== R.token) return;
  $('spin').classList.remove('on');
  stage.scrollTop = 0;
  saveProgress();
  // camada de texto: permite selecionar e copiar frases do PDF
  const tl = $('tl');
  if(R.tl){ try{R.tl.cancel();}catch(e){} }
  tl.innerHTML = '';
  tl.style.width = cv.style.width; tl.style.height = cv.style.height;
  tl.style.setProperty('--scale-factor', vp.scale);
  try{
    const tc = await page.getTextContent();
    if(my !== R.token) return;
    R.tl = pdfjs.renderTextLayer({textContentSource:tc, container:tl, viewport:vp, textDivs:[]});
    await R.tl.promise;
  }catch(e){}
}
let saveT = null;
function saveProgress(){
  const b = R.book; if(!b || !R.doc) return;
  b.page = R.n; b.pages = R.doc.numPages;
  b.progress = Math.round(R.n / b.pages * 100); // página atual ÷ total de páginas
  clearTimeout(saveT);
  saveT = setTimeout(()=>{ store.putBook(b).catch(()=>{}); }, 400);
}
$('rClose').onclick = closeReader;
$('prev').onclick = ()=>show(R.n-1);
$('next').onclick = ()=>show(R.n+1);
$('zIn').onclick = ()=>{ R.zoom = Math.min(4, +(R.zoom+0.25).toFixed(2)); show(R.n); };
$('zOut').onclick = ()=>{ R.zoom = Math.max(1, +(R.zoom-0.25).toFixed(2)); show(R.n); };
$('rNotes').onclick = ()=>{ if(R.book) openNotes(R.book); };
$('rNight').onclick = function(){ stage.classList.toggle('night'); this.classList.toggle('act'); };
$('pgIn').addEventListener('change',()=>{ const v=parseInt($('pgIn').value,10); if(v) show(v); else $('pgIn').value=R.n; });
$('pgIn').addEventListener('keydown',e=>{ if(e.key==='Enter') e.target.blur(); });
document.addEventListener('keydown',e=>{
  if(!$('reader').classList.contains('on') || e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight'||e.key==='PageDown') show(R.n+1);
  if(e.key==='ArrowLeft'||e.key==='PageUp') show(R.n-1);
  if(e.key==='Escape') closeReader();
});
// deslizar para virar a página (quando sem zoom)
let sx=0, sy=0, st=0;
stage.addEventListener('touchstart',e=>{ if(e.touches.length!==1) return; sx=e.touches[0].clientX; sy=e.touches[0].clientY; st=Date.now(); },{passive:true});
stage.addEventListener('touchend',e=>{
  if(R.zoom>1 || !e.changedTouches.length) return;
  if(String(window.getSelection()).trim()) return;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60 && Math.abs(dy)<50 && Date.now()-st<600) show(R.n + (dx<0?1:-1));
},{passive:true});
let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if($('reader').classList.contains('on')) show(R.n); },250); });

let lastSel = '', hideQ;
document.addEventListener('selectionchange',()=>{
  if(!$('reader').classList.contains('on')) return;
  const sel = window.getSelection();
  const txt = String(sel).replace(/\s+/g,' ').trim();
  if(txt && sel.anchorNode && $('tl').contains(sel.anchorNode)){
    lastSel = txt; clearTimeout(hideQ); $('qNote').classList.add('on');
  }else{
    clearTimeout(hideQ); hideQ = setTimeout(()=>$('qNote').classList.remove('on'), 400);
  }
});
['pointerdown','mousedown'].forEach(ev=>$('qNote').addEventListener(ev,e=>e.preventDefault()));
$('qNote').addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
$('qNote').addEventListener('click',async ()=>{
  if(!lastSel || !R.book) return;
  await addNote(R.book, lastSel, R.n);
  window.getSelection().removeAllRanges();
  $('qNote').classList.remove('on'); lastSel='';
  toast('Salvo em Anotações');
});

/* ---------- Toast ---------- */
let tt; function toast(msg,ms){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),ms||2600); }

load();
window.addEventListener('load',()=>{ if(!window.pdfjsLib) toast('O leitor de PDF não carregou. Verifique a internet.',6000); });
})();
